[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "builtii"
version = "6.0.0"
description = "Evidence-first engineering drawing takeoff and independent audit"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.package-data]
web = ["static/*"]
prompts = ["*.md"]
schemas = ["*.json"]

[tool.setuptools.packages.find]
include = ["pipeline*", "prompts*", "schemas*", "web*"]

[project.scripts]
builtii = "main:main"
